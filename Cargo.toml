[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
aieye-collect = { path = "crates/aieye-collect" }
aieye-defs = { path = "crates/aieye-defs" }
aieye-model = { path = "crates/aieye-model" }
aieye-store = { path = "crates/aieye-store" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
glob = "0.3.4"
jiff = { version = "0.2.38", features = ["serde"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = "2"
tauri-plugin-dialog = "2"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[workspace.lints.rust]
# Modules that call OS APIs directly opt in with #[allow(unsafe_code)].
unsafe_code = "deny"
