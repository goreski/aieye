<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="title desc">
  <title id="title">How AIEye works</title>
  <desc id="desc">AI tools act on files, processes, network, scheduled tasks and configs on your device, and the operating system records it. AIEye reads only those records: Watch shows inventory, activity, schedules and change alerts; Guard, planned, keeps AI processes out of no-go zones. What an AI tool says about itself is never evidence. Every fact is labelled verified, declared or inferred.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 14px; fill: #f0f6fc; }
    .bg { fill: #151b23; stroke: #3d444d; }
    .card { fill: #0d1117; stroke: #3d444d; }
    .row { fill: #151b23; stroke: #3d444d; }
    .dash { fill: none; stroke: #3d444d; stroke-dasharray: 4 4; }
    .sep { stroke: #3d444d; }
    .m { fill: #9198a1; }
    .h { fill: #9198a1; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
    .s { font-size: 12px; }
    .s2 { font-size: 13px; }
    .xs { font-size: 11px; font-weight: 600; }
    .b { font-weight: 600; }
    .wire { fill: none; stroke: #656c76; stroke-width: 1.5; }
    .wiref { fill: #656c76; }
    .eye { fill: #12243b; stroke: #4493f8; stroke-width: 1.5; }
    .eyet { fill: #4493f8; font-size: 18px; font-weight: 700; }
    .okbg { fill: #12261e; }
    .okt { fill: #3fb950; }
    .warnbg { fill: #272115; }
    .warnt { fill: #d29922; }
    .infobg { fill: #221a33; }
    .infot { fill: #ab7df8; }
    .bad { fill: none; stroke: #f85149; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .badx { fill: none; stroke: #f85149; stroke-width: 2; stroke-linecap: round; }
    .badf { fill: #f85149; }
    .badbg { fill: #2b1416; stroke: #f85149; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="wiref" d="M0 0L10 5L0 10z"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="badf" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="431" rx="12"/>

  <text class="h" x="32" y="44">AI TOOLS</text>
  <text class="h" x="312" y="44">YOUR DEVICE KEEPS THE RECORD</text>
  <text class="h" x="700" y="44">WHAT YOU GET</text>

  <!-- AI tools -->
  <rect class="card" x="32" y="72" width="200" height="34" rx="17"/>
  <text x="132" y="94" text-anchor="middle">Claude Code</text>
  <rect class="card" x="32" y="116" width="200" height="34" rx="17"/>
  <text x="132" y="138" text-anchor="middle">Codex CLI</text>
  <rect class="card" x="32" y="160" width="200" height="34" rx="17"/>
  <text x="132" y="182" text-anchor="middle">GitHub Copilot CLI</text>
  <rect class="card" x="32" y="204" width="200" height="34" rx="17"/>
  <text x="132" y="226" text-anchor="middle">Claude desktop</text>
  <rect class="dash" x="32" y="248" width="200" height="34" rx="17"/>
  <text class="m s2" x="132" y="270" text-anchor="middle">+ yours: one TOML file</text>

  <path class="wire" d="M232 89H256M232 133H256M232 177H256M232 221H256M232 265H256M256 89V265"/>
  <path class="wire" d="M256 177H308" marker-end="url(#arrow)"/>
  <text class="m s" x="284" y="168" text-anchor="middle">act on</text>

  <!-- Device -->
  <rect class="card" x="312" y="64" width="320" height="224" rx="12"/>
  <rect class="row" x="328" y="80" width="288" height="32" rx="8"/>
  <text x="344" y="101">Files and folders</text>
  <rect class="okbg" x="540" y="87" width="64" height="18" rx="9"/>
  <text class="okt xs" x="572" y="100" text-anchor="middle">verified</text>
  <rect class="row" x="328" y="120" width="288" height="32" rx="8"/>
  <text x="344" y="141">Processes</text>
  <rect class="okbg" x="540" y="127" width="64" height="18" rx="9"/>
  <text class="okt xs" x="572" y="140" text-anchor="middle">verified</text>
  <rect class="row" x="328" y="160" width="288" height="32" rx="8"/>
  <text x="344" y="181">Network and DNS</text>
  <rect class="okbg" x="540" y="167" width="64" height="18" rx="9"/>
  <text class="okt xs" x="572" y="180" text-anchor="middle">verified</text>
  <rect class="row" x="328" y="200" width="288" height="32" rx="8"/>
  <text x="344" y="221">Scheduled tasks</text>
  <rect class="okbg" x="540" y="207" width="64" height="18" rx="9"/>
  <text class="okt xs" x="572" y="220" text-anchor="middle">verified</text>
  <rect class="row" x="328" y="240" width="288" height="32" rx="8"/>
  <text x="344" y="261">Configs and MCP servers</text>
  <rect class="warnbg" x="540" y="247" width="64" height="18" rx="9"/>
  <text class="warnt xs" x="572" y="260" text-anchor="middle">declared</text>

  <path class="wire" d="M632 156H696" marker-end="url(#arrow)"/>
  <text class="m s" x="666" y="147" text-anchor="middle">records</text>
  <path class="bad" d="M700 238H636" marker-end="url(#arrow-bad)"/>
  <text class="badf s" x="668" y="229" text-anchor="middle">blocks</text>

  <!-- AIEye -->
  <rect class="eye" x="700" y="64" width="228" height="224" rx="12"/>
  <text class="eyet" x="716" y="93">AIEye</text>
  <text class="m s" x="716" y="111">reads only what the OS records</text>
  <rect class="card" x="716" y="122" width="196" height="68" rx="8"/>
  <text class="b" x="730" y="144">Watch</text>
  <text class="m s" x="730" y="162">inventory · activity</text>
  <text class="m s" x="730" y="178">schedules · change alerts</text>
  <rect class="card" x="716" y="204" width="196" height="68" rx="8"/>
  <text class="b" x="730" y="226">Guard</text>
  <rect class="row" x="782" y="213" width="58" height="17" rx="8.5"/>
  <text class="m xs" x="811" y="225" text-anchor="middle">planned</text>
  <text class="m s" x="730" y="244">no-go zones that AI</text>
  <text class="m s" x="730" y="260">processes cannot open</text>

  <!-- Self-reports are not evidence -->
  <path class="bad" d="M256 265V336H458"/>
  <circle class="badbg" cx="472" cy="336" r="12"/>
  <path class="badx" d="M467 331L477 341M477 331L467 341"/>
  <text class="s2" x="494" y="341">What an AI tool says about itself is <tspan class="badf b">never evidence</tspan></text>

  <!-- Evidence labels -->
  <path class="sep" d="M32 368H928"/>
  <text class="m s2" x="32" y="404">Every fact carries a label:</text>
  <rect class="okbg" x="244" y="390" width="66" height="20" rx="10"/>
  <text class="okt s b" x="277" y="404" text-anchor="middle">verified</text>
  <text class="m s" x="318" y="404">OS or service records</text>
  <rect class="warnbg" x="476" y="390" width="70" height="20" rx="10"/>
  <text class="warnt s b" x="511" y="404" text-anchor="middle">declared</text>
  <text class="m s" x="554" y="404">the tool's own config</text>
  <rect class="infobg" x="712" y="390" width="66" height="20" rx="10"/>
  <text class="infot s b" x="745" y="404" text-anchor="middle">inferred</text>
  <text class="m s" x="786" y="404">deterministic rules</text>
</svg>
